# QM signal bot configuration
# Thresholds are ATR multiples, not raw price, so one config works across every
# coin in the dynamic universe without retuning per symbol.

state_db: signals.db
log_dir: logs   # daily text logs, e.g. logs/2026-08-17.log — see qmbotctl.py

line:
  # Never commit a real token — leave null here, set LINE_CHANNEL_ACCESS_TOKEN in .env instead.
  channel_access_token: null
  # Your own userId (starts with "U..."), captured once via webhook_capture.py.
  # Leave null here and set LINE_TO_USER_ID in .env instead.
  to: null

# --- Symbol universe -------------------------------------------------------
# Data source: Binance USDⓈ-M perpetual futures (linear, USDT-margined) — NOT
# spot. Prices/structure differ from spot (funding-rate basis, no delivery),
# which is expected: this bot is meant to read the futures chart, matching
# what most retail traders mean by "Binance Futures". Symbols below can stay
# in plain "BASE/USDT" form — universe.to_perp_symbol() converts to ccxt's
# unified futures symbol ("BASE/USDT:USDT") automatically.
#
# BTC/USDT and ETH/USDT are always included. The remaining slots are filled at
# startup by universe.top_usdt_pairs() with the top-N Binance futures contracts
# by 24h quote volume (leveraged tokens excluded), cached for one day so we
# are not hitting the ticker endpoint on every scan.
universe:
  exchange: binanceusdm
  always_include: [BTC/USDT, ETH/USDT]
  top_n: 100
  cache_path: universe_cache.json
  cache_ttl_hours: 24

# Timeframes scanned for every symbol in the universe.
timeframes:
  - "1h"
  - "4h"

source:
  type: ccxt
  exchange: binanceusdm

limit: 500        # candles fetched per request
fresh_bars: 1      # only alert on signals that triggered within the last N closed bars
unit: coin         # position-size unit label used in the Flex "Size" row

# --- QM detection ------------------------------------------------------
# Per-timeframe overrides for pivot_left/pivot_right — 4H uses wider swings
# per the skill's own guidance (L=R=5 for 4H+, 3 for 1H).
qm:
  "1h":
    pivot_left: 3
    pivot_right: 3
    atr_period: 14
    min_sweep_atr: 0.10
    min_bos_atr: 0.10
    over_tol_atr: 0.50
    sl_buffer_atr: 0.25
    min_rr: 1.5
    max_bars_to_retest: 50
    trigger_mode: close_reject
    tp2_extension: 0.618
  "4h":
    pivot_left: 5
    pivot_right: 5
    atr_period: 14
    min_sweep_atr: 0.10
    min_bos_atr: 0.10
    over_tol_atr: 0.50
    sl_buffer_atr: 0.25
    min_rr: 1.5
    max_bars_to_retest: 50
    trigger_mode: close_reject
    tp2_extension: 0.618

# --- Divergence confirmation --------------------------------------------
# A detected QM is only sent to LINE if RSI(14) diverges from price between
# the LS and HEAD pivots (bearish: RSI lower high vs price higher high;
# bullish: mirror). See divergence.py.
divergence:
  rsi_period: 14
  min_rsi_diff: 2.0
  required: true    # if false, signals are sent regardless of divergence (tagged either way)

# --- Higher-timeframe (HTF) structure alignment --------------------------
# Rejects a signal that clearly fights the higher timeframe's trend (a
# bearish 1H signal while 4H is making higher-highs/higher-lows, or the
# mirror). The highest-value confluence filter per the skill's own theory
# doc and the research behind it — see htf_filter.py. A "neutral"/undecided
# HTF reading never blocks anything; this only removes clear contradictions.
htf_filter:
  enabled: true
  reference:
    "1h": "4h"    # 1H signals are checked against 4H structure; 4H signals
                  # aren't cross-checked (no higher timeframe is scanned)
  pivot_left: 3
  pivot_right: 3
  lookback: 6     # how many recent confirmed swing pivots to read the trend from

risk:
  equity: 10000
  risk_pct: 0.01

chart:
  render_width_px: 1200

# Cloudflare R2 (S3-compatible). Real credentials live in .env, not here.
r2:
  bucket: null              # overridden by R2_BUCKET env var
  public_base_url: null     # overridden by R2_PUBLIC_BASE_URL env var
