# QM signal bot configuration
# Thresholds are ATR multiples, not raw price, so one config works across every
# coin in the dynamic universe without retuning per symbol.

state_db: signals.db
log_dir: logs   # daily text logs, e.g. logs/2026-08-17.log — see qmbotctl.py

line:
  # Never commit a real token — leave null here, set LINE_CHANNEL_ACCESS_TOKEN in .env instead.
  channel_access_token: null
  # Your own userId (starts with "U..."), captured once via webhook_capture.py.
  # Leave null here and set LINE_TO_USER_ID in .env instead.
  to: null

# --- Symbol universe -------------------------------------------------------
# Data source: Binance USDⓈ-M perpetual futures (linear, USDT-margined) — NOT
# spot. Prices/structure differ from spot (funding-rate basis, no delivery),
# which is expected: this bot is meant to read the futures chart, matching
# what most retail traders mean by "Binance Futures". Symbols below can stay
# in plain "BASE/USDT" form — universe.to_perp_symbol() converts to ccxt's
# unified futures symbol ("BASE/USDT:USDT") automatically.
#
# BTC/USDT and ETH/USDT are always included. The remaining slots are filled at
# startup by universe.top_usdt_pairs() with the top-N Binance futures contracts
# by 24h quote volume (leveraged tokens excluded), cached for one day so we
# are not hitting the ticker endpoint on every scan.
universe:
  exchange: binanceusdm
  always_include: [BTC/USDT, ETH/USDT]
  top_n: 100
  cache_path: universe_cache.json
  cache_ttl_hours: 24

# Timeframes scanned for every symbol in the universe.
timeframes:
  - "1h"
  - "4h"

source:
  type: ccxt
  exchange: binanceusdm

limit: 500        # candles fetched per request
fresh_bars: 1      # only alert on signals that triggered within the last N closed bars
unit: coin         # position-size unit label used in the Flex "Size" row

# --- QM detection ------------------------------------------------------
# Per-timeframe overrides for pivot_left/pivot_right.
#
# 1H uses a WIDE swing window (15) on purpose: a swing must dominate 15 bars
# on each side to count, so the patterns found are the large ones visible
# when you zoom out over a week of 1H chart — not 3-bar wiggles. Paired with
# max_bars_to_retest=168 (= 168 x 1H = one week) so a big pattern has room
# to come back for its retest.
#
# Backtested on 418,390 1H bars (40 symbols, ~500 days), expectancy per trade,
# divergence gate on, HTF gate off:
#
#   pivot / retest      in-sample        out-of-sample
#     3 / 50   (old)     +0.383R (531)    +0.404R (204)
#     3 / 168            +0.305R (645)    +0.529R (273)
#    10 / 168            +0.549R (223)    +0.581R (130)
#    12 / 168            +0.727R (188)    +0.592R (107)
#    15 / 168  (now)     +0.606R (156)    +0.840R  (86)
#
# The whole 13-22 pivot range is positive in both samples (OOS 0.57-0.86),
# so 15 sits on a plateau rather than a lucky spike — its neighbours 13 and
# 18 both hold up. Expect roughly 3x FEWER signals than the old 3/50 setting.
#
# Note this was measured at 15 symbols first, where pivot=12 looked best and
# pivot=15 looked unreliable (n=34). Only after widening to 40 symbols did
# the ranking stabilise — small samples were the reason, not the market.
#
# 1H is scanned with TWO profiles so both scales get reported and the trader
# decides which to act on. Each signal is labelled with the profile it came
# from ("1h short" / "1h wide") in LINE, the chart title, and the dedupe key,
# so the two never overwrite each other.
qm:
  "1h":
    # short view — patterns roughly 0.5-3 days wide
    - name: short
      pivot_left: 3
      pivot_right: 3
      atr_period: 14
      min_sweep_atr: 0.10
      min_bos_atr: 0.10
      over_tol_atr: 0.50
      sl_buffer_atr: 0.25
      min_rr: 1.5
      max_bars_to_retest: 50
      trigger_mode: close_reject
      tp2_extension: 0.618
    # wide view — patterns roughly 3-10 days wide (the week-scale structure)
    - name: wide
      pivot_left: 15
      pivot_right: 15
      atr_period: 14
      min_sweep_atr: 0.10
      min_bos_atr: 0.10
      over_tol_atr: 0.50
      sl_buffer_atr: 0.25
      min_rr: 1.5
      max_bars_to_retest: 168   # 1 week of 1H bars
      trigger_mode: close_reject
      tp2_extension: 0.618
  # 4H left unchanged: pivot 5 already spans 5 x 4H = 20 hours, and
  # max_bars_to_retest 50 = 50 x 4H ≈ 8 days, so this timeframe is already
  # looking at roughly week-scale structure. The "wider view" change above
  # was specifically about the 1H chart.
  "4h":
    pivot_left: 5
    pivot_right: 5
    atr_period: 14
    min_sweep_atr: 0.10
    min_bos_atr: 0.10
    over_tol_atr: 0.50
    sl_buffer_atr: 0.25
    min_rr: 1.5
    max_bars_to_retest: 50
    trigger_mode: close_reject
    tp2_extension: 0.618

# --- Divergence confirmation --------------------------------------------
# A detected QM is only sent to LINE if RSI(14) diverges from price between
# the LS and HEAD pivots (bearish: RSI lower high vs price higher high;
# bullish: mirror). See divergence.py.
divergence:
  rsi_period: 14

  # --- primary gate: the final leg, BOS -> RS ---
  # How much RSI the retest regained on its way back to the QML. Low means
  # the bounce is limp, so the level is more likely to hold. This replaced
  # the LS<->HEAD reading, which spanned the whole pattern (often days) and
  # said little about the retest actually being traded.
  #
  # Backtested on 830k 1H bars (15 symbols, 6.6 years), expectancy per trade:
  #
  #   gate                 in-sample        out-of-sample     trades (IS/OOS)
  #   LS<->HEAD (old)      +0.434R          +0.473R           1154 / 551
  #   BOS<->RS < 15        +0.519R          +0.489R           1808 / 822
  #   BOS<->RS < 10 (now)  +0.683R          +0.618R            956 / 428
  #   BOS<->RS <  5        +0.824R          +0.902R            348 / 170
  #   BOS<->RS <  3        +0.921R          +1.037R            225 / 103
  #
  # The relationship is monotonic in both samples with no peak — it is a
  # pure quality/quantity dial, not a value with an optimum to find. 10 was
  # chosen to keep signal volume close to the previous gate (~140/month vs
  # ~171) while raising expectancy substantially. Lower it for fewer, better
  # signals; the LINE quota has room either way.
  bos_rs_max: 10.0

  # A single threshold cannot serve both profiles: the wide profile's BOS->RS
  # leg spans far more bars, so RSI has more room to recover and its bounce
  # values run about twice as high (median 33 vs 17). Applying 10 to both
  # passed 22% of short signals but only 2% of wide ones — it silently killed
  # the wide profile until a 99-symbol backtest surfaced it.
  #
  # Measured per profile on 99 symbols (2.6M 1H bars):
  #   1h short  <10  +0.592R in-sample (3027)  +0.634R out (1428)  <- best
  #   1h wide   <10  +0.592R        (104)  +0.262R out   (22)  too few to trust
  #   1h wide   <15  +0.428R        (196)  +0.583R out   (61)
  #   1h wide   <20  +0.290R        (416)  +0.631R out  (150)  <- chosen
  bos_rs_max_by_profile:
    "1h wide": 20.0

  # LS<->HEAD is no longer a gate. Left switchable for comparison: turning it
  # on as well raises expectancy further but cuts trades hard (OOS +0.856R on
  # only 113 trades vs 428).
  required: false
  min_rsi_diff: 2.0

  # --- last-swing momentum grade (A/B/C) ---
  # Measures how much momentum faded on the QM's FINAL leg (BOS -> RS): does
  # the rally back into the QML arrive exhausted, or still strong? Measured
  # in RSI points vs the head. Out-of-sample (2024-2026, 830k bars, both
  # profiles):
  #     A  diff > 5       n=132  win 53.8%  +1.031R  PF 2.94
  #     B  0 < diff <= 5  n=113  win ~38%   +0.39R   PF ~1.5
  #     C  diff <= 0      n=306  win 27.5%  +0.265R  PF 1.31
  # Thresholds 4-6 all sit on the same plateau (OOS 0.93-1.03), so 5 is not
  # a lucky pick. Every grade is still profitable, so the default GRADES the
  # signal and sends it — the grade rides along in the LINE message and the
  # trader decides. Set min_diff (e.g. 0 or 5) to drop weak ones instead.
  last_swing:
    grade_a_min: 5.0
    grade_b_min: 0.0
    min_diff: null

# --- Higher-timeframe (HTF) structure alignment --------------------------
# Rejects a signal that clearly fights the higher timeframe's trend (a
# bearish 1H signal while 4H is making higher-highs/higher-lows, or the
# mirror). See htf_filter.py.
#
# DISABLED after backtesting on 89,985 1H bars (15 symbols, ~250 days).
# It was added on the strength of general multi-timeframe research, but on
# THIS strategy it made every metric worse, in-sample AND out-of-sample:
#
#                        trades   win%   expectancy   PF     maxDD
#   divergence only        171    39.8%    +0.767R   2.07   -13.4R
#   + HTF alignment        118    34.7%    +0.589R   1.75   -19.8R
#
# The likely reason is conceptual: QM is a REVERSAL pattern, so a valid
# bearish QM is *supposed* to appear while the higher timeframe still reads
# bullish — the 4H has not turned yet, that is the trade. Demanding HTF
# agreement therefore filters out precisely the early reversals the pattern
# exists to catch, keeping only late continuation-style setups.
#
# Left in place (code + config) so it can be re-tested; flip to true and
# compare with: python backtest_full.py --bars 6000 --split 0.3
htf_filter:
  enabled: false
  reference:
    "1h": "4h"    # 1H signals are checked against 4H structure; 4H signals
                  # aren't cross-checked (no higher timeframe is scanned)
  pivot_left: 3
  pivot_right: 3
  lookback: 6     # how many recent confirmed swing pivots to read the trend from

# --- Daily Bitcoin trend report (daily_report.py) ------------------------
# Sent by the systemd timer at 10:00 Asia/Bangkok. Trade signals take
# priority over this summary, so when the month's LINE allowance is running
# down the report steps back to weekly and leaves the rest for signals.
daily_report:
  quota_throttle:
    enabled: true
    threshold_pct: 50   # once monthly LINE usage passes this, drop to weekly
    weekly_day: 0       # 0 = Monday (Python weekday numbering)

# --- คุณภาพแท่งเทียนที่จุดโครงสร้าง (candle_quality.py) ------------------
# BOS ที่แท้จริงต้องมี "เนื้อเทียน" ปิดเลย L1 ลงไป ไม่ใช่แค่ไส้แทงแล้วเด้งกลับ
# ซึ่งอย่างหลังคือการกวาด liquidity ฝั่งล่าง ไม่ใช่การทำลายโครงสร้าง
#
# วัดบน 98 เหรียญ / 2.59 ล้านแท่ง 1H (out-of-sample):
#     ปิดตัวกรอง            1578 ไม้  win 45.8%  +0.634R  PF 2.02
#     เปิด (ค่าปัจจุบัน)      462 ไม้  win 50.6%  +0.966R  PF 2.74
#   แยกตามโปรไฟล์: short +0.634->+0.979 | wide +0.631->+0.897
#
# ** ตัดสัญญาณทิ้งราว 71% ** ถ้าอยากได้สัญญาณเยอะเหมือนเดิมให้ตั้ง
# enabled: false แล้วดูค่า bosBody ใน log/ข้อความ LINE เพื่อตัดสินใจเอง
candle_quality:
  enabled: true
  require_bos_body: true    # BOS ต้องมีเนื้อปิดทะลุ L1
  require_head_wick: false  # HEAD ต้องเป็นไส้กวาด (+0.755R แต่ทับซ้อนกับข้อบน)

risk:
  # ทุนจริงของผู้ใช้ — ช่อง "Size" ในข้อความ LINE คำนวณจากค่านี้โดยตรง
  # ถ้าไม่ตรงกับพอร์ตจริง ตัวเลขขนาดไม้ที่ส่งมาก็ใช้ไม่ได้
  equity: 120
  # เสี่ยงกี่ % ของทุนต่อไม้ -> 120 x 1% = เสี่ยง 1.20 USDT ต่อไม้
  # ขนาดไม้ = 1.20 / ระยะ (entry - stop) ไม่ได้แปลว่า "ใช้เงิน" 1.20 USDT
  #
  # วัดจริงบนสัญญาณย้อนหลัง 93 เหรียญ ที่ทุน 120 USDT เสี่ยง 1%:
  #   ระยะ stop มัธยฐาน 1.36% ของราคา (p5 0.42% / p95 4.71%)
  #   notional มัธยฐาน 88.5 USDT = ใช้ leverage แค่ 0.74 เท่า (p95 = 2.39 เท่า)
  #   วางออเดอร์ได้จริง 99.3% ของสัญญาณ เทียบกับขั้นต่ำจริงของ Binance
  # ที่เหลือ 0.7% คือไม้ที่เล็กกว่าขั้นต่ำของเหรียญนั้น (ส่วนใหญ่คือ BTC ซึ่ง
  # ขั้นต่ำ 50 USDT/ออเดอร์ และ 0.001 BTC — ไม้ BTC ที่ stop กว้างจะไม่ถึง)
  # ถ้าขึ้น risk_pct ตัวเลขทุกอย่างข้างบนจะโตตามเป็นสัดส่วนตรงๆ
  risk_pct: 0.01

chart:
  render_width_px: 1200

# Cloudflare R2 (S3-compatible). Real credentials live in .env, not here.
r2:
  bucket: null              # overridden by R2_BUCKET env var
  public_base_url: null     # overridden by R2_PUBLIC_BASE_URL env var
